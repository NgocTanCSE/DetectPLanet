services:
  postgres:
    build:
      context: /tmp/agriscan-db
      dockerfile: Dockerfile
    container_name: agriscan-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agriscan"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: agriscan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: agriscan-api
    restart: unless-stopped
    ports:
      - "887:80"
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: agriscan
      DB_USER: postgres
      DB_PASS: postgres
      DB_DRIVER: pgsql
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_VISION_MODEL: ${CLOUDFLARE_VISION_MODEL:-@cf/meta/llama-3.2-11b-vision-instruct}
      CLOUDFLARE_CHAT_MODEL: ${CLOUDFLARE_CHAT_MODEL:-@cf/meta/llama-3.1-8b-instruct-fp8}
      AI_TIMEOUT: 90
      AI_ENDPOINT: ""
      CHAT_ENDPOINT: ""
      AGRISCAN_DEMO: ${AGRISCAN_DEMO:-0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - agriscan_uploads:/var/www/html/uploads
    depends_on:
      postgres:
        condition: service_healthy
        required: true

volumes:
  postgres_data:
  agriscan_uploads:
