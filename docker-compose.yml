# ─────────────────────────────────────────────────────────────────────────
# AgriScan AI — Unified Docker Compose (ALL services in ONE file)
#
# Services: PostgreSQL + PHP API (both start by default)
# AI inference: Cloudflare Workers AI (@cf/meta/llama-4-scout-17b-16e-instruct)
#
# ── Single command to bring the entire system up: ──
#     docker compose up --build -d                   # full stack (with PostgreSQL)
#     docker compose up --build -d --scale postgres=0  # serverless MVP (no DB)
# ── Useful commands ──
#     docker compose logs -f     # follow all logs
#     docker compose down -v     # stop + destroy volumes (clean reset)
#     docker compose ps          # show running containers
#
# ── Deploy the Cloudflare Worker (run once): ──
#     cd workers/ai-worker
#     npm install
#     npx wrangler deploy --env production
# ─────────────────────────────────────────────────────────────────────────
services:
  # ── PostgreSQL Database (started by default with `docker compose up`) ──
  # To skip the DB (serverless MVP mode): docker compose up --scale postgres=0
  postgres:
    image: postgres:16-alpine
    container_name: agriscan-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agriscan}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: agriscan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run once on first (empty) container startup:
      #   init.sql      -> schema + base seed
      #   seed_data.sql -> extended seed (scans, articles, guides)
      - ./db/agriscan_schema_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/seed_data.sql:/docker-entrypoint-initdb.d/seed_data.sql:ro

  # ── PHP API ──────────────────────────────────────────────────────────
  # Serves the REST API (auth, scan, analyze, chat) on port 887.
  # AI inference is offloaded to Cloudflare Workers AI (no local AI container).
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: agriscan-api
    restart: unless-stopped
    ports:
      - "887:80"                   # Expose API on port 887 (matches app.json extra.apiUrl)
      - "1887:80"                  # Second mapping used by the Google OAuth relay:
                                   # Google blocks private-IP redirects, so dev uses
                                   # http://localhost:1887/auth/google/callback
                                   # with `adb reverse tcp:1887 tcp:1887`.
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-agriscan}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_DRIVER: ${DB_DRIVER:-pgsql}
      # Cloudflare Workers AI — called DIRECTLY from PHP via REST API.
      # Token needs: Account → Workers AI (Edit).
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_VISION_MODEL: ${CLOUDFLARE_VISION_MODEL:-@cf/meta/llama-4-scout-17b-16e-instruct}
      CLOUDFLARE_VISION_FALLBACK: ${CLOUDFLARE_VISION_FALLBACK:-@cf/meta/llama-4-scout-17b-16e-instruct}
      CLOUDFLARE_CHAT_MODEL: ${CLOUDFLARE_CHAT_MODEL:-@cf/meta/llama-3.3-70b-instruct-fp8-fast}
      AI_TIMEOUT: ${AI_TIMEOUT:-90}
      # Optional legacy overrides (full URLs of a self-hosted AI worker):
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      CHAT_ENDPOINT: ${CHAT_ENDPOINT:-}
      # Production mode — real AI only, no mock fallback when DB/AI is unavailable.
      AGRISCAN_DEMO: ${AGRISCAN_DEMO:-0}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-com.agriscan.ai://auth}
      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - ./db/api/uploads:/var/www/html/uploads
    depends_on:
      postgres: { condition: service_healthy, required: false }  # required:false so --scale postgres=0 works for serverless mode (API falls back to no-DB state)

  # ── Scheduler — job nền (GĐ2: rủi ro thời tiết; GĐ3/GĐ4: tin chính thức, gom báo cáo)
  # Cùng image với api, chỉ khác entrypoint. Mỗi 30 phút gọi `run.php loop`;
  # job nào đã đến giờ (theo bảng job_runs) thì chạy.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: agriscan-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-agriscan}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_DRIVER: ${DB_DRIVER:-pgsql}
      WEATHER_ENABLED: ${WEATHER_ENABLED:-1}
      OPEN_METEO_BASE: ${OPEN_METEO_BASE:-https://api.open-meteo.com/v1/forecast}
      RISK_THRESHOLD: ${RISK_THRESHOLD:-40}
      OFFICIAL_ENABLED: ${OFFICIAL_ENABLED:-0}
    command: sh -c "while true; do php /var/www/html/jobs/run.php loop; sleep 1800; done"
    healthcheck:
      disable: true          # image api có HEALTHCHECK gọi Apache :80, scheduler chỉ chạy PHP CLI
    depends_on:
      postgres: { condition: service_healthy, required: false }
      api: { condition: service_started, required: false }

volumes:
  postgres_data:
