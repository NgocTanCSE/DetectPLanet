# ─────────────────────────────────────────────────────────────────────────
# AgriScan AI — nginx: single entry point
#
#   • Serves the Expo web bundle as static files (SPA with index.html fallback)
#   • Reverse-proxies /detectplanet_api/ → PHP API container
#   • Reverse-proxies /uploads/         → PHP API (leaf images)
#   • AI inference is via Cloudflare Workers AI (proxied through PHP API)
#
# For production HTTPS behind a real domain, use nginx/nginx.prod.conf
# (mount it + SSL certs via docker-compose.prod.yml overlay).
# ─────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # ── Upstream: PHP API container ──────────────────────────────────
    upstream php_api {
        server api:80;
    }

    server {
        listen 80;
        server_name _;

        # ── Root: Expo web build (static files baked into the image) ──────
        root /usr/share/nginx/html;
        index index.html;

        # ── Security headers ──────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:" always;

        # ── PHP API routes ────────────────────────────────────────────────
        # /detectplanet_api/* → PHP API (clean URLs via .htaccess rewrite)
        location /detectplanet_api/ {
            proxy_pass http://php_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Uploaded leaf images (served by PHP API) ──────────────────────
        location /uploads/ {
            proxy_pass http://php_api/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            expires 1h;
        }

        # AI inference is via Cloudflare Workers AI, proxied through PHP API.
        # No direct /ai/ route needed — frontend calls /analyze and /chat on the API.

        # ── Web frontend (SPA — fallback to index.html) ──────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Gzip compression ──────────────────────────────────────────────
        gzip on;
        gzip_vary on;
        gzip_min_length 256;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript text/xml;
    }
}
