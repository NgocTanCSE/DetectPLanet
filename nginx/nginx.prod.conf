# ─────────────────────────────────────────────────────────────────────────
# AgriScan AI — nginx PRODUCTION config (HTTPS / SSL termination)
#
# Same structure as nginx.conf but with SSL enabled.
# Mount this at /etc/nginx/nginx.conf via docker-compose.prod.yml.
# Requires certs at /etc/nginx/certs/ (fullchain.pem + privkey.pem).
# ─────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    upstream php_api {
        server api:80;
    }

    # Cloudflare Workers AI is accessed via the PHP API proxy.
    # No local AI container needed.

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        # ── SSL (Let's Encrypt, mounted from ./nginx/certs/) ──────────────
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ── Root: Expo web build (static files baked into the image) ──────
        root /usr/share/nginx/html;
        index index.html;

        # ── Security headers ──────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:" always;

        # ── PHP API routes ────────────────────────────────────────────────
        location /detectplanet_api/ {
            proxy_pass http://php_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Uploaded leaf images ──────────────────────────────────────────
        location /uploads/ {
            proxy_pass http://php_api/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            expires 1h;
        }

        # AI inference is via Cloudflare Workers AI, proxied through PHP API.
        # No direct /ai/ route needed.

        # ── Web frontend (SPA) ────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Gzip ──────────────────────────────────────────────────────────
        gzip on;
        gzip_vary on;
        gzip_min_length 256;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript text/xml;
    }
}
